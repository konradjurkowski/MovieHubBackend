spring.application.name=MovieHubServer

spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# In-memory H2 - testy nie dotykaja plikowej bazy dev
spring.datasource.url=jdbc:h2:mem:moviehub-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=test-secret-test-secret-test-secret-test-secret-1234567890abcdef
jwt.access-token-expiration=43200000
jwt.refresh-token-expiration=2592000000

# SMTP - dummy, testy nie wysylaja maili
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# TMDB - dummy
tmdb.base-url=http://localhost
tmdb.token=test-token
